<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        #header {
            padding: 20px;
            background: #2c3e50;
            color: white;
            border-radius: 10px 10px 0 0;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: #007bff;
            color: white;
        }

        .ai {
            align-self: flex-start;
            background: #e9ecef;
            color: black;
        }

        #input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fafafa;
            border-radius: 0 0 10px 10px;
        }

        #question {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        button {
            padding: 12px 24px;
            margin-left: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background: #218838;
        }

        .loading {
            font-style: italic;
            color: #666;
        }
    </style>
</head>

<body>

    <div id="chat-container">
        <div id="header">🧠 Local Second Brain</div>
        <div id="chat-window">
            <div class="message ai">Hello! I am your local Second Brain. I have ingested your Java notes. Ask me
                anything.</div>
        </div>

        <!-- The new upload area sits directly above the chat input -->
        <div id="upload-area"
            style="padding: 10px 15px; background: #e9ecef; font-size: 0.9em; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center;">
            <input type="file" id="fileInput" accept=".md,.txt,.pdf" style="flex: 1;">
            <button onclick="uploadDocument()" style="padding: 6px 12px; background: #6c757d; font-size: 0.9em;">Upload
                Document</button>
            <span id="upload-status" style="color: #28a745; font-weight: bold; font-size: 0.9em;"></span>
        </div>

        <!-- You only need ONE input area -->
        <div id="input-area">
            <input type="text" id="question" placeholder="Ask a question..." onkeypress="handleEnter(event)">
            <button onclick="askQuestion()">Send</button>
        </div>

        <div class="chat-controls">
            <!-- The dropdown for file filtering -->
            <select id="fileSelector">
                <option value="">All Files (Entire Brain)</option>
            </select>

            <!-- Your existing input -->
            <input type="text" id="chatInput" placeholder="Ask your Second Brain..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>

        // 1. Fetch files when the page loads
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('/api/files');
                const files = await response.json();

                const selector = document.getElementById('fileSelector');
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    selector.appendChild(option);
                });
            } catch (error) {
                console.error("Failed to load files:", error);
            }
        });

        async function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const question = inputField.value.trim();
            const selectedFile = document.getElementById('fileSelector').value;

            if (!question) return;

            let url = `/api/chat/ask?question=${encodeURIComponent(question)}`;
            if (selectedFile !== "") {
                url += `&filename=${encodeURIComponent(selectedFile)}`;
            }

            const chatWindow = document.getElementById('chat-window');
            const messageId = 'msg-' + Date.now();
            chatWindow.innerHTML += `<div class="message user">${question}</div>`;
            chatWindow.innerHTML += `<div id="${messageId}" class="message ai loading">Thinking...</div>`;
            const aiMessageDiv = document.getElementById(messageId);
            inputField.value = '';

            try {
                const response = await fetch(url);
                const resultText = await response.text();
                aiMessageDiv.classList.remove('loading');
                aiMessageDiv.innerHTML = resultText;
                chatWindow.scrollTop = chatWindow.scrollHeight;
            } catch (error) {
                aiMessageDiv.classList.remove('loading');
                aiMessageDiv.innerHTML = '<span style="color: red;">Error connecting to the brain.</span>';
            }
        }

        async function askQuestion() {
            const input = document.getElementById('question');
            const chatWindow = document.getElementById('chat-window');
            const query = input.value.trim();
            if (!query) return;

            chatWindow.innerHTML += `<div class="message user">${query}</div>`;
            input.value = '';

            const messageId = 'msg-' + Date.now();
            chatWindow.innerHTML += `<div id="${messageId}" class="message ai"></div>`;
            const aiMessageDiv = document.getElementById(messageId);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(`/api/chat/ask?question=${encodeURIComponent(query)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const textChunk = decoder.decode(value);
                    aiMessageDiv.innerHTML += textChunk.replace(/\n/g, '<br>');
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }
            } catch (error) {
                aiMessageDiv.innerHTML = `<span style="color: red;">Error connecting to the brain.</span>`;
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') askQuestion();
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            const statusSpan = document.getElementById('upload-status');

            if (fileInput.files.length === 0) {
                statusSpan.style.color = 'red';
                statusSpan.innerText = 'Please select a file first.';
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            statusSpan.style.color = '#6c757d';
            statusSpan.innerText = 'Uploading and chunking...';

            try {
                const response = await fetch('/api/admin/upload', {
                    method: 'POST',
                    body: formData
                });

                const resultText = await response.text();

                if (resultText.startsWith("Success")) {
                    statusSpan.style.color = '#28a745';
                } else {
                    statusSpan.style.color = 'red';
                }
                statusSpan.innerText = resultText;
                fileInput.value = '';

            } catch (error) {
                statusSpan.style.color = 'red';
                statusSpan.innerText = 'Upload failed due to network error.';
            }
        }
    </script>
</body>

</html>
